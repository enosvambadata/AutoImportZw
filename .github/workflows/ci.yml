name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autobid
          POSTGRES_PASSWORD: autobid
          POSTGRES_DB: autobid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autobid" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://autobid:autobid@localhost:5432/autobid
      DATABASE_URL_SYNC: postgresql+psycopg://autobid:autobid@localhost:5432/autobid
      JWT_SECRET_KEY: ci-secret-key-please-override
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check app
      - name: Mypy
        run: mypy app || true  # advisory in CI for the MVP
      - name: Alembic migrations
        run: alembic upgrade head
      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
